# 个人简介（首页第一段，第三人称、3-5 句，参考何国俊/王绍达的写法）
bio_zh: |
  黄允，南京大学政府管理学院应急管理专业博士研究生（2025 年入学），师从张海波教授；
  硕士毕业于华侨大学行政管理专业（2024），本科毕业于华侨大学金融专业（2021）。
  研究兴趣集中在政策扩散、产业政策、人工智能与公共治理、应急管理、自然灾害与气候变化，
  主要采用因果推断（DID、RDD 等）、基于大语言模型的政策文本分析以及机器学习方法
  （广义随机森林、双重机器学习）开展公共政策评估研究。
  论文发表于 International Review of Economics & Finance、
  Humanities and Social Sciences Communications 等期刊。

