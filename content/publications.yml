#   doi      DOI 链接，可留空
#   links    [{label: PDF, url: ...}, {label: Slides, url: ...}]，没有就留空
#   note     备注（如"通讯作者"），首页以小字显示
# 新增一篇就复制一整条，改内容即可。
# =====================================================================

